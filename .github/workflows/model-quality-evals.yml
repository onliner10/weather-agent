name: Model Quality Evals

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

env:
  LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'weather-agent-preprod' }}

jobs:
  langsmith-evals:
    name: LangSmith model quality evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run LangSmith model quality evals
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          WEATHER_AGENT_MODEL__API_KEY: ${{ secrets.WEATHER_AGENT_MODEL__API_KEY }}
        run: uv run python scripts/eval/run_model_quality_evals.py
