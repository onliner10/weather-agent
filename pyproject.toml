[project]
name = "weather-agent"
version = "0.1.0"
description = "Telegram weather AI agent foundations and runtime contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.7.0",
    "deepagents>=0.3.5",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "python-telegram-bot[all]>=21.0",
    "structlog>=24.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "prometheus-client>=0.20.0",
    "croniter>=6.2.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "freezegun>=1.5.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "respx>=0.22.0",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0.12.20260408",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-m 'not smoke'"
markers = [
    "smoke: tests that call real external APIs (skipped by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["weather_agent"]
mypy_path = ["src"]
